  <title id="logo-title">kwx_ts</title>
  <desc id="logo-desc">The wxWidgets three-block mark with a hollow, extruded TypeScript wordmark floating above it. The wordmark runs from dark red on the left through dark blue in the middle to dark yellow on the right. Light comes from the upper left, so the extrusion and drop shadow fall to the lower right.</desc>
